services:
  - type: web
    name: plancrick-backend
    env: docker
    region: oregon
    plan: free
    buildCommand: dotnet restore && dotnet publish -c Release -o out
    startCommand: dotnet out/PlanCrick.Backend.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: plancrick-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: plancrick-db
    databaseName: plancrick
    plan: free
    ipAllowList: []
